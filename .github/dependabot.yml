# Weekly, one grouped PR per ecosystem, into staging like every other change.
# Security fixes are not batched: they open as soon as GitHub knows.
version: 2

updates:
    - package-ecosystem: npm
      directory: /
      target-branch: staging
      schedule:
          interval: weekly
          day: monday
      groups:
          npm:
              patterns: ["*"]
      commit-message:
          prefix: chore(deps)

    - package-ecosystem: gomod
      directory: /api
      target-branch: staging
      schedule:
          interval: weekly
          day: monday
      groups:
          go:
              patterns: ["*"]
      commit-message:
          prefix: chore(deps)

    - package-ecosystem: github-actions
      directory: /
      target-branch: staging
      schedule:
          interval: weekly
          day: monday
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          prefix: chore(deps)

    - package-ecosystem: docker
      directories: [/, /ops/backup]
      target-branch: staging
      schedule:
          interval: weekly
          day: monday
      groups:
          docker:
              patterns: ["*"]
      commit-message:
          prefix: chore(deps)
