# Every deploy goes through here (the jobs: deploy-run.yml). A PR runs this file too, skipped by the
# guard: GitHub still checks the call before it starts, so a broken workflow shows on the PR, through
# pr.yml's deploy-check job, instead of after the merge. This job's permissions must cover deploy-run's.
name: deploy

on:
    push:
        branches: [staging, main]
    pull_request:
        branches: [staging, main]

permissions:
    contents: read

# One deploy per environment at a time; never cancelled halfway.
concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    run:
        if: github.event_name == 'push'
        permissions:
            actions: read
            contents: read
            pull-requests: write
            statuses: write
        uses: ./.github/workflows/deploy-run.yml
        secrets: inherit
