# Only staging can be released into main, and the title names the version release.yml tags.
name: release-source

on:
    pull_request:
        branches: [main]
        types: [opened, edited, synchronize, reopened]

# Jobs that need more ask for it themselves.
permissions:
    contents: read

jobs:
    release-source:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - id: check
              env:
                  HEAD: ${{ github.head_ref }}
                  TITLE: ${{ github.event.pull_request.title }}
              run: |
                  refuse() { echo "$1"; echo "why=$1" >> "$GITHUB_OUTPUT"; exit 1; }
                  [ "$HEAD" = "staging" ] || refuse "Only staging can be released into main, not $HEAD."
                  [[ "$TITLE" =~ ^release:\ [0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || refuse "Title must be 'release: YYYY.MM.N', got: $TITLE"
            - if: always()
              uses: ./.github/actions/report
              with:
                  section: release-source
                  title: Release PR refused
                  commit: ${{ github.event.pull_request.head.sha }}
                  overall: ${{ steps.check.outcome == 'success' && 'success' || 'failure' }}
                  update-only: ${{ steps.check.outcome == 'success' }}
                  done-text: Release PR accepted
                  body: ${{ steps.check.outputs.why }}
