# Each app is a Cloudflare Pages project; its /api Function forwards to Railway.
# A PR gets previews on the staging API. Staging's alias and production are deployed by
# deploy.yml, which calls this after the API they call is up.
name: pages

on:
    workflow_call:
        inputs:
            production:
                type: boolean
                default: false
            sha:
                type: string
                default: ""
            version:
                type: string
                default: ""
    pull_request:
        branches: [staging]
        paths:
            [
                "apps/**",
                "packages/**",
                "api/openapi.yaml",
                "pnpm-lock.yaml",
                ".github/workflows/pages.yml",
            ]

concurrency:
    group: pages-${{ inputs.production && 'production' || github.ref }}
    cancel-in-progress: ${{ !inputs.production }}

jobs:
    deploy:
        # Forks and Dependabot get no secrets, so no preview.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: write
        strategy:
            matrix:
                include:
                    - app: seller
                      project: tea-pos
                    - app: backoffice
                      project: tea-office
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            WRANGLER: npx -y wrangler@4.151.3
            BRANCH: ${{ inputs.production && 'main' || github.head_ref || github.ref_name }}
            APP_COMMIT: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
            APP_VERSION: ${{ inputs.version || 'preview' }}
            PAGES_ENV: ${{ inputs.production && 'production' || 'preview' }}
            EDGE_SECRET: ${{ inputs.production && secrets.EDGE_SECRET_PRODUCTION || secrets.EDGE_SECRET_STAGING }}
        defaults:
            run:
                working-directory: apps/${{ matrix.app }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.sha || '' }}
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @tea-pos/${{ matrix.app }} build
            # App errors read with our files and lines in PostHog: each file gets its chunk id, the maps go
            # to PostHog, and are deleted before deploying (a phone never downloads one). Task 016c.
            - name: Source maps
              env:
                  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_SOURCEMAPS_KEY }}
                  # TEA-POS-PROD and TEA-POS-STG (previews and staging report to staging's).
                  POSTHOG_CLI_PROJECT_ID: ${{ inputs.production && '446129' || '445574' }}
              run: |
                  if [ -n "$POSTHOG_CLI_API_KEY" ]; then
                      npx -y @posthog/cli@0.18.9 sourcemap inject --directory dist/assets
                      npx -y @posthog/cli@0.18.9 sourcemap upload --directory dist/assets \
                          --release-name "${{ matrix.app }}" --release-version "$APP_VERSION" --delete-after
                  fi
                  rm -f dist/assets/*.map
            - name: Project exists
              run: $WRANGLER pages project create ${{ matrix.project }} --production-branch main 2>/dev/null || true
            - name: Secret
              run: printf '%s' "$EDGE_SECRET" | $WRANGLER pages secret put EDGE_SECRET --project-name ${{ matrix.project }} --env "$PAGES_ENV"
            - name: Deploy
              id: deploy
              run: |
                  $WRANGLER pages deploy --project-name ${{ matrix.project }} --branch "$BRANCH" | tee out.txt
                  echo "url=$(grep -o 'https://[^ ]*pages.dev' out.txt | tail -1)" >> "$GITHUB_OUTPUT"
            - if: github.event_name == 'pull_request'
              uses: ./.github/actions/report
              with:
                  section: preview-${{ matrix.app }}
                  title: "Preview: ${{ matrix.app }}"
                  commit: ${{ github.event.pull_request.head.sha }}
                  overall: success
                  done-text: Ready
                  body: "${{ steps.deploy.outputs.url }} (on the staging API)"
