# The end-to-end tests on staging, by hand (Actions → e2e → Run workflow). PRs into main read
# staging's result in pr.yml; deploy.yml runs them after every staging deploy.
name: e2e

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-staging
    cancel-in-progress: false

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            TEST_LOGIN_KEY: ${{ secrets.TEST_LOGIN_KEY }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: staging
            - uses: actions/setup-go@v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            # The fake test users, idempotent; only test- tenants.
            - env:
                  DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
              run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f api/tests/e2e/seed.sql
            - run: cd api && go test -tags e2e -count=1 -v ./tests/e2e/
