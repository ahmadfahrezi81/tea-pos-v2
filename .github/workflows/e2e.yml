# API end-to-end tests against staging, through each app's /api forwarder: on every release PR
# (staging holds exactly its code; a red result blocks the merge), and by hand from the Actions tab.
# Not after each merge: Railway's Wait for CI would wait for this run while it waits for Railway.
name: e2e

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-staging
    cancel-in-progress: false

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: read
            pull-requests: write
        env:
            TEST_LOGIN_KEY: ${{ secrets.TEST_LOGIN_KEY }}
            HEALTH: https://tea-office-staging.lykostech.app/api/health
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || 'staging' }}
                  fetch-depth: 0
            # Staging must run this code: the newest commit that changed the API (Railway's watch
            # paths), or one after it. A release opened right after a merge waits for the deploy.
            - name: Wait for staging's API
              run: |
                  want=$(git log -1 --format=%H -- api Dockerfile)
                  for _ in $(seq 60); do
                      got=$(curl -fsS "$HEALTH" | jq -r .commit || true)
                      if [ -n "$got" ] && git merge-base --is-ancestor "$want" "$got" 2>/dev/null; then
                          echo "E2E_COMMIT=$got" >> "$GITHUB_ENV"
                          echo "staging runs $got (wanted $want or later)"
                          exit 0
                      fi
                      sleep 15
                  done
                  echo "staging still runs ${got:-nothing} after 15 minutes, wanted $want"
                  exit 1
            - uses: actions/setup-go@v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            # The fake test users, idempotent; only test- tenants.
            - env:
                  DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
              run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f api/tests/e2e/seed.sql
            - id: run
              run: |
                  set -o pipefail
                  cd api && go test -tags e2e -count=1 -v ./tests/e2e/ 2>&1 | tee ../e2e.log
            # One row per test, for the PR comment and the run's summary page.
            - if: always()
              id: report
              run: |
                  table=$(awk '/^--- (PASS|FAIL|SKIP)/ { icon = $2 == "PASS:" ? "✅" : $2 == "FAIL:" ? "❌" : "⏭️"; print "| " icon " | `" $3 "` | " $4 " |" }' e2e.log | tr -d '()')
                  [ -n "$table" ] || table="| ❌ | no tests ran (see the run) | |"
                  {
                      echo "### API end-to-end tests on staging"
                      echo "${{ steps.run.outcome == 'success' && '✅ pass' || '❌ fail' }} · staging at \`${E2E_COMMIT:-?}\` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                      echo
                      echo "| | Test | Time |"
                      echo "| --- | --- | --- |"
                      echo "$table"
                  } > e2e.md
                  cat e2e.md >> "$GITHUB_STEP_SUMMARY"
                  { echo "body<<EOF"; cat e2e.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
            - if: always() && github.event_name == 'pull_request'
              uses: ./.github/actions/pr-comment
              with:
                  section: e2e
                  body: ${{ steps.report.outputs.body }}

    # How fast the release is on staging, for the Benchmark log: information, never blocking.
    # A shared runner varies between runs, so its numbers are a series of their own.
    benchmark:
        needs: e2e
        runs-on: ubuntu-latest
        timeout-minutes: 15
        continue-on-error: true
        permissions:
            contents: read
            pull-requests: write
        env:
            TEST_LOGIN_KEY: ${{ secrets.TEST_LOGIN_KEY }}
            CHROME_PATH: /usr/bin/google-chrome
            BENCH_REPORT: bench.md
            BENCH_DEVICE: CI runner
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || 'staging' }}
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # runner.temp is only allowed inside steps, not in the job's env.
            - env:
                  BENCH_PROFILE: ${{ runner.temp }}/bench-profile
              run: pnpm bench --test-user admin@test-a.test https://tea-office-staging.lykostech.app
            - if: always()
              id: report
              run: |
                  {
                      echo "### Benchmark: backoffice on staging"
                      echo "Information only, never blocks the release. CI runner numbers are their own series. [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                      echo
                      cat bench.md 2>/dev/null || echo "❌ the benchmark did not finish (see the run)"
                  } > comment.md
                  cat comment.md >> "$GITHUB_STEP_SUMMARY"
                  { echo "body<<EOF"; cat comment.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
            - if: always() && github.event_name == 'pull_request'
              uses: ./.github/actions/pr-comment
              with:
                  section: benchmark
                  body: ${{ steps.report.outputs.body }}
