# Production: on a release merge, applies exactly the plan pinned to the release PR.
# Staging: every push plans and applies at once (a push has no PR to pin a plan to).
# A plan that deletes anything fails; deletes are done by hand.
name: railway-apply

on:
    push:
        branches: [main, staging]
        paths: [".railway/**"]

permissions:
    contents: read
    actions: read
    pull-requests: read

jobs:
    production:
        if: github.ref_name == 'main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: railwayapp/config@v1
              with:
                  command: apply
                  railway-token: ${{ secrets.RAILWAY_TOKEN }}
                  confirm-destructive: false

    staging:
        if: github.ref_name == 'staging'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency: railway-staging
        env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: npm install -g @railway/cli@5.68.0
            - run: railway config plan --environment staging
            - run: railway config apply --environment staging --yes
