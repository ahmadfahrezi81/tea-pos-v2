name: ci

on:
    push:
    pull_request:
        branches: [staging, main]

concurrency:
    group: ci-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/setup-go@v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
            - run: pnpm --filter @tea-pos/api generate:check
            - run: pnpm --filter @tea-pos/api-client generate:check

    integration:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
        env:
            TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            - run: cd api && go test -tags integration -count=1 ./tests/...

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t tea-pos-api .
            - run: docker build -t tea-pos-backup ops/backup
            - run: cd ops/backup && shellcheck --external-sources *.sh

    comment:
        if: always() && github.event_name == 'pull_request'
        needs: [checks, docker, integration]
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/pr-comment
              with:
                  section: checks
                  body: |
                      ### Checks
                      | Job | Result |
                      | --- | --- |
                      | `checks` (format, lint, typecheck, tests, build, generated code up to date) | ${{ needs.checks.result == 'success' && '✅' || '❌' }} ${{ needs.checks.result }} |
                      | `docker` (images, backup scripts) | ${{ needs.docker.result == 'success' && '✅' || '❌' }} ${{ needs.docker.result }} |
                      | `integration` (Go against a throwaway Postgres) | ${{ needs.integration.result == 'success' && '✅' || '❌' }} ${{ needs.integration.result }} |

                      Commit `${{ github.event.pull_request.head.sha }}` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
