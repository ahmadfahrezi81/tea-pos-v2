# A change is tested once, at its PR, against exactly what will merge (staging requires the
# PR to be up to date). Merges only deploy; the release PR adds e2e. Task: 015b_ci-review.md
name: ci

on:
    pull_request:
        branches: [staging, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Jobs that need more ask for it themselves.
permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/setup-go@v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
            - id: bundle
              run: |
                  BUNDLE_REPORT=bundle.md pnpm bundle-size || failed=1
                  { echo 'report<<EOF'; cat bundle.md; echo; echo 'EOF'; } >> "$GITHUB_OUTPUT"
                  exit "${failed:-0}"
            - run: pnpm --filter @tea-pos/api generate:check
            - run: pnpm --filter @tea-pos/api-client generate:check
            # A broken workflow file otherwise only shows up after the push; shellcheck reads its scripts.
            - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
            # Fails only on vulnerabilities our code actually calls.
            - run: cd api && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
            - if: always() && github.event.pull_request.user.login != 'dependabot[bot]' && steps.bundle.outputs.report
              uses: ./.github/actions/pr-comment
              with:
                  section: bundle-size
                  body: ${{ steps.bundle.outputs.report }}

    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
        env:
            TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            - run: cd api && go test -tags integration -count=1 ./tests/...
            # Again as staging builds it, with the test sign-in compiled in.
            - run: cd api && go test -tags integration,testlogin -count=1 -run 'TestTestSignIn|TestPermission' ./tests/...

    docker:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t tea-pos-api .
            # Production's image is built without tags: the test sign-in must not be in it.
            - run: |
                  id=$(docker create tea-pos-api) && docker cp "$id:/app/api" /tmp/api && docker rm "$id" >/dev/null
                  if LC_ALL=C grep -a -q "/auth/test" /tmp/api; then echo "the production image contains the test sign-in"; exit 1; fi
            - run: docker build -t tea-pos-backup ops/backup
            - run: cd ops/backup && shellcheck --external-sources ./*.sh

    comment:
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        needs: [checks, docker, integration]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/pr-comment
              with:
                  section: checks
                  body: |
                      ### Checks
                      | Job | Result |
                      | --- | --- |
                      | `checks` (format, lint, typecheck, tests, build, bundle size, generated code up to date, govulncheck) | ${{ needs.checks.result == 'success' && '✅' || '❌' }} ${{ needs.checks.result }} |
                      | `docker` (images, backup scripts) | ${{ needs.docker.result == 'success' && '✅' || '❌' }} ${{ needs.docker.result }} |
                      | `integration` (Go against a throwaway Postgres) | ${{ needs.integration.result == 'success' && '✅' || '❌' }} ${{ needs.integration.result }} |

                      Commit `${{ github.event.pull_request.head.sha }}` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
