name: ci

on:
    push:
    pull_request:
        branches: [staging, main]

concurrency:
    group: ci-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/setup-go@v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t tea-pos-api .
            - run: docker build -t tea-pos-backup ops/backup
            - run: cd ops/backup && shellcheck --external-sources *.sh

    comment:
        if: always() && github.event_name == 'pull_request'
        needs: [checks, docker]
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/pr-comment
              with:
                  section: checks
                  body: |
                      ### Checks
                      | Job | Result |
                      | --- | --- |
                      | `checks` (format, lint, typecheck, tests, build) | ${{ needs.checks.result == 'success' && '✅' || '❌' }} ${{ needs.checks.result }} |
                      | `docker` (images, backup scripts) | ${{ needs.docker.result == 'success' && '✅' || '❌' }} ${{ needs.docker.result }} |

                      Commit `${{ github.event.pull_request.head.sha }}` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
