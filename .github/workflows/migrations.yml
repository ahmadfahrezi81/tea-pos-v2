# A PR into staging shows which migrations its merge would run. The migrations themselves run in
# deploy.yml, before the API: on the merge into staging, and on a release after the owner approves.
name: migrations

on:
    pull_request:
        branches: [staging]
        paths: ["supabase/migrations/**"]

permissions:
    contents: read

jobs:
    dry-run:
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - uses: supabase/setup-cli@v3
              with:
                  version: 2.121.0
            - id: plan
              env:
                  DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
              run: |
                  out=$(supabase db push --dry-run --db-url "$DATABASE_URL" 2>&1)
                  echo "$out"
                  # Only the migration names; the CLI's update notice and progress lines are noise here.
                  # shellcheck disable=SC2016 # the backticks are Markdown, not a command
                  list=$(grep -oE '[0-9]{14}_[a-z0-9_]+\.sql' <<< "$out" | sed 's/^/- `/; s/$/`/' || true)
                  {
                      echo "body<<EOF"
                      if [ -n "$list" ]; then echo "Merging runs these on the staging database, before its API deploys:"; echo; echo "$list"; else echo "None to run: the staging database is up to date."; fi
                      echo EOF
                  } >> "$GITHUB_OUTPUT"
            - uses: ./.github/actions/report
              with:
                  section: migrations
                  title: Migrations
                  commit: ${{ github.event.pull_request.head.sha }}
                  overall: success
                  done-text: Dry run on staging
                  body: ${{ steps.plan.outputs.body }}
