# Fails a PR that adds a package with a known high or critical vulnerability.
# CodeQL runs from GitHub's default setup (repo settings), not from here.
name: security

on:
    pull_request:
        branches: [staging, main]

permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: actions/dependency-review-action@v5
              with:
                  fail-on-severity: high

    comment:
        needs: dependency-review
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - id: why
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node .github/scripts/failures.mjs
            - uses: ./.github/actions/report
              with:
                  section: security
                  title: Security
                  commit: ${{ github.event.pull_request.head.sha }}
                  overall: ${{ needs.dependency-review.result == 'failure' && 'failure' || 'success' }}
                  done-text: No high-severity package added
                  body: ${{ steps.why.outputs.body || 'Dependency review passed.' }}
