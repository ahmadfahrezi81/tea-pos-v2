# Fails a PR that adds a package with a known high or critical vulnerability.
# CodeQL runs from GitHub's default setup (repo settings), not from here.
name: security

on:
    pull_request:
        branches: [staging, main]

permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/dependency-review-action@v5
              with:
                  fail-on-severity: high
