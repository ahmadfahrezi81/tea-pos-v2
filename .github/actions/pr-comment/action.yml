name: PR comment
description: Writes one section's comment on the PR, editing it in place if it already exists.

inputs:
    section:
        description: Key for this section, e.g. checks
        required: true
    body:
        description: Markdown body
        required: true
    pr:
        description: The PR number, when the event is not a PR (e.g. a merged release on main)
        required: false

runs:
    using: composite
    steps:
        - shell: bash
          env:
              GH_TOKEN: ${{ github.token }}
              SECTION: ${{ inputs.section }}
              BODY: ${{ inputs.body }}
              PR: ${{ inputs.pr || github.event.pull_request.number }}
              REPO: ${{ github.repository }}
          run: |
              marker="<!-- pr-comment:${SECTION} -->"
              body="${marker}"$'\n'"${BODY}"
              id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                  --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)
              if [ -n "$id" ]; then
                  gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" --silent
              else
                  gh api "repos/${REPO}/issues/${PR}/comments" -f body="$body" --silent
              fi
