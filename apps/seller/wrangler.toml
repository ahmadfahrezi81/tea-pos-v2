# Cloudflare Pages project for seller. Preview and staging builds use the staging API; production uses production's.
name = "tea-pos"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[vars]
APP = "seller"
API_ORIGIN = "https://api-staging-c60d.up.railway.app"

[env.production.vars]
APP = "seller"
API_ORIGIN = "https://api-production-f3625.up.railway.app"
