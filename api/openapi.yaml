components:
  schemas:
    Error:
      additionalProperties: false
      properties:
        code:
          examples:
            - day_already_closed
          type: string
        details:
          items:
            type: string
          type:
            - array
            - "null"
        message:
          examples:
            - The day is already closed
          type: string
        status:
          examples:
            - 409
          format: int64
          type: integer
      required:
        - status
        - code
        - message
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        commit:
          examples:
            - a1b2c3d
          type: string
        status:
          examples:
            - ok
          type: string
        version:
          examples:
            - 2026.10.3
          type: string
      required:
        - status
        - version
        - commit
      type: object
    Me:
      additionalProperties: false
      properties:
        tenants:
          description: Empty when the user belongs to no tenant
          items:
            $ref: "#/components/schemas/MeTenant"
          type: array
        user:
          $ref: "#/components/schemas/MeUser"
      required:
        - user
        - tenants
      type: object
    MeStore:
      additionalProperties: false
      properties:
        closeTime:
          examples:
            - "22:00"
          type: string
        id:
          format: uuid
          type: string
        isDefault:
          description: The store this user's app opens on
          type: boolean
        name:
          type: string
        openTime:
          examples:
            - "08:00"
          type: string
        status:
          examples:
            - active
          type: string
      required:
        - id
        - name
        - status
        - openTime
        - closeTime
        - isDefault
      type: object
    MeTenant:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        payFrequency:
          examples:
            - bi_weekly
          type: string
        slug:
          type: string
        stores:
          description: "Seller: the stores the user is assigned to. Backoffice: every store of the tenant"
          items:
            $ref: "#/components/schemas/MeStore"
          type: array
      required:
        - id
        - slug
        - name
        - payFrequency
        - stores
      type: object
    MeUser:
      additionalProperties: false
      properties:
        avatarUrl:
          type: string
        email:
          type: string
        fullName:
          type: string
        id:
          format: uuid
          type: string
        language:
          description: The profile's language; the app keeps a copy
          examples:
            - id
          type: string
        role:
          examples:
            - USER
          type: string
      required:
        - id
        - email
        - fullName
        - role
        - language
      type: object
info:
  title: tea-pos API
  version: dev
openapi: 3.1.0
paths:
  /auth/callback:
    get:
      operationId: finishSignIn
      parameters:
        - description: From Supabase after Google sign-in
          explode: false
          in: query
          name: code
          schema:
            description: From Supabase after Google sign-in
            type: string
        - explode: false
          in: query
          name: error
          schema:
            type: string
        - description: Set by /auth/google
          in: cookie
          name: tea_pkce
          schema:
            description: Set by /auth/google
            type: string
        - in: header
          name: User-Agent
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Finish Google sign-in and set the session cookie
      tags:
        - auth
      x-access:
        public: true
        rateLimited: true
  /auth/google:
    get:
      operationId: startSignIn
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Start Google sign-in
      tags:
        - auth
      x-access:
        public: true
        rateLimited: true
  /auth/logout:
    post:
      operationId: signOut
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Sign out of this app on this phone
      tags:
        - auth
      x-access:
        signedIn: true
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Service health, version and commit
      tags:
        - system
      x-access:
        public: true
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The signed-in user, their tenants and stores
      tags:
        - me
      x-access:
        signedIn: true
