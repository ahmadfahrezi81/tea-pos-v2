components:
  schemas:
    AppEvent:
      additionalProperties: false
      properties:
        at:
          description: The phone's clock; Go uses its own when this is far off
          format: date-time
          type: string
        chunks:
          additionalProperties:
            type: string
          type: object
        message:
          maxLength: 2000
          type: string
        name:
          examples:
            - TypeError
          maxLength: 200
          type: string
        path:
          examples:
            - /test-a/home
          maxLength: 300
          type: string
        ready:
          $ref: "#/components/schemas/AppReady"
        stack:
          maxLength: 8000
          type: string
        type:
          enum:
            - error
            - pageview
            - pageleave
            - app_ready
          type: string
      required:
        - type
        - path
        - at
      type: object
    AppReady:
      additionalProperties: false
      properties:
        hidden:
          description: "Hidden at some moment before ready: the time is not the app's"
          type: boolean
        htmlMs:
          description: The page's first byte (responseStart)
          format: double
          minimum: 0
          type: number
        jsMs:
          description: The main script done (domContentLoadedEventEnd)
          format: double
          minimum: 0
          type: number
        me:
          description: Whether the first screen drew /me from the phone's copy; none on sign-in
          enum:
            - saved
            - network
            - none
          type: string
        open:
          description: "network: no service worker yet; saved: from its copy; update: the first open of a new version"
          enum:
            - network
            - saved
            - update
          type: string
        paintMs:
          description: "First paint: the splash (first-contentful-paint)"
          format: double
          minimum: 0
          type: number
        readyMs:
          format: double
          minimum: 0
          type: number
        screen:
          enum:
            - shell
            - signin
            - other
          type: string
      required:
        - readyMs
        - htmlMs
        - jsMs
        - paintMs
        - open
        - me
        - screen
        - hidden
      type: object
    Device:
      additionalProperties: false
      properties:
        cores:
          format: int64
          type: integer
        downlink:
          description: Mbit/s
          format: double
          type: number
        memory:
          description: GB, navigator.deviceMemory (rounded by the browser)
          format: double
          type: number
        model:
          description: Android Chrome's client hints
          examples:
            - SM-M115F
          maxLength: 60
          type: string
        net:
          description: navigator.connection.effectiveType
          examples:
            - 4g
          maxLength: 10
          type: string
        osVersion:
          maxLength: 20
          type: string
        rtt:
          description: ms
          format: int64
          type: integer
        saveData:
          type: boolean
        screenHeight:
          format: int64
          type: integer
        screenWidth:
          format: int64
          type: integer
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          enum:
            - account_inactive
            - app_too_old
            - bad_request
            - conflict
            - error
            - files_unavailable
            - forbidden
            - idempotency_key_required
            - idempotency_key_reused
            - internal
            - maintenance
            - not_allowed
            - not_found
            - not_in_tenant
            - not_signed_in
            - route_not_found
            - store_not_found
            - store_required
            - too_large
            - too_many_requests
            - unauthorized
            - unknown_app
          examples:
            - day_already_closed
          type: string
        details:
          items:
            type: string
          type:
            - array
            - "null"
        message:
          examples:
            - The day is already closed
          type: string
        status:
          examples:
            - 409
          format: int64
          type: integer
      required:
        - status
        - code
        - message
      type: object
    EventsInputBody:
      additionalProperties: false
      properties:
        device:
          $ref: "#/components/schemas/Device"
        events:
          items:
            $ref: "#/components/schemas/AppEvent"
          maxItems: 50
          minItems: 1
          type: array
        session:
          format: uuid
          type: string
      required:
        - events
        - session
        - device
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        commit:
          examples:
            - a1b2c3d
          type: string
        status:
          examples:
            - ok
          type: string
        version:
          examples:
            - 2026.10.3
          type: string
      required:
        - status
        - version
        - commit
      type: object
    Me:
      additionalProperties: false
      properties:
        flags:
          additionalProperties:
            type: boolean
          description: The feature flags on for this user (rules on role and app); a store's own are on the store
          type: object
        tenants:
          description: Empty when the user belongs to no tenant
          items:
            $ref: "#/components/schemas/MeTenant"
          type: array
        user:
          $ref: "#/components/schemas/MeUser"
      required:
        - user
        - tenants
        - flags
      type: object
    MePatchInputBody:
      additionalProperties: false
      properties:
        language:
          enum:
            - en
            - id
          type: string
      required:
        - language
      type: object
    MeStore:
      additionalProperties: false
      properties:
        closeTime:
          examples:
            - "22:00"
          type: string
        flags:
          additionalProperties:
            type: boolean
          description: The feature flags on at this store (rules on tenantId and storeId); a flag not listed is off
          type: object
        id:
          format: uuid
          type: string
        isDefault:
          description: The store this user's app opens on
          type: boolean
        name:
          type: string
        openTime:
          examples:
            - "08:00"
          type: string
        status:
          examples:
            - active
          type: string
      required:
        - id
        - name
        - status
        - openTime
        - closeTime
        - isDefault
        - flags
      type: object
    MeTenant:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        payFrequency:
          examples:
            - bi_weekly
          type: string
        slug:
          type: string
        stores:
          description: "Seller: the stores the user is assigned to. Backoffice: every store of the tenant"
          items:
            $ref: "#/components/schemas/MeStore"
          type: array
      required:
        - id
        - slug
        - name
        - payFrequency
        - stores
      type: object
    MeUser:
      additionalProperties: false
      properties:
        avatarUrl:
          type: string
        email:
          type: string
        fullName:
          type: string
        id:
          format: uuid
          type: string
        language:
          description: The profile's language; the app keeps a copy
          examples:
            - id
          type: string
        role:
          examples:
            - USER
          type: string
      required:
        - id
        - email
        - fullName
        - role
        - language
      type: object
    UploadInputBody:
      additionalProperties: false
      properties:
        contentType:
          enum:
            - image/webp
            - image/jpeg
          type: string
        purpose:
          enum:
            - daily_photo
            - report
            - request
            - reimbursement
            - payroll_proof
            - product_image
          type: string
        size:
          description: Bytes, after the phone shrank it
          format: int64
          maximum: 1048576
          minimum: 1
          type: integer
        storeId:
          description: "For a store's photos: daily_photo, report, request"
          format: uuid
          type: string
      required:
        - purpose
        - contentType
        - size
      type: object
    UploadOutputBody:
      additionalProperties: false
      properties:
        path:
          description: Where it is kept, for the row that refers to it
          type: string
        uploadUrl:
          description: PUT the photo here, straight to Storage; it works for a few minutes
          type: string
        url:
          description: The address saved in the row (the old app's form); a private photo opens only through a signed address
          type: string
      required:
        - uploadUrl
        - path
        - url
      type: object
info:
  title: tea-pos API
  version: dev
openapi: 3.1.0
paths:
  /auth/callback:
    get:
      operationId: finishSignIn
      parameters:
        - description: From Supabase after Google sign-in
          explode: false
          in: query
          name: code
          schema:
            description: From Supabase after Google sign-in
            type: string
        - explode: false
          in: query
          name: error
          schema:
            type: string
        - description: Set by /auth/google
          in: cookie
          name: tea_pkce
          schema:
            description: Set by /auth/google
            type: string
        - in: header
          name: User-Agent
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Finish Google sign-in and set the session cookie
      tags:
        - auth
      x-access:
        public: true
        rateLimited: true
  /auth/google:
    get:
      operationId: startSignIn
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Start Google sign-in
      tags:
        - auth
      x-access:
        public: true
        rateLimited: true
  /auth/logout:
    post:
      operationId: signOut
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Sign out of this app on this phone
      tags:
        - auth
      x-access:
        repeatable: true
        signedIn: true
  /auth/logout-everywhere:
    post:
      operationId: logoutEverywhere
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Sign out of every app on every phone
      tags:
        - auth
      x-access:
        repeatable: true
        signedIn: true
  /events:
    post:
      operationId: sendEvents
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Errors, page views and open times from an app, for PostHog
      tags:
        - system
      x-access:
        repeatable: true
        signedIn: true
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Service health, version and commit
      tags:
        - system
      x-access:
        public: true
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: The signed-in user, their tenants and stores
      tags:
        - me
      x-access:
        signedIn: true
    patch:
      operationId: patchMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePatchInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Change the signed-in user's own language
      tags:
        - me
      x-access:
        repeatable: true
        signedIn: true
  /tenants/{tenant}/files:
    post:
      operationId: signUpload
      parameters:
        - in: path
          name: tenant
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: An address to upload one photo to, straight to Storage
      tags:
        - files
      x-access:
        tenant: true
        repeatable: true
        signedIn: true
